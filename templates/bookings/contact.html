{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<section class="section two-col">
  <div>
    <h1>Contact us</h1>
    <p class="muted">Questions or problems? Send us a message.</p>
    <form method="post" novalidate>{% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Send message</button>
    </form>
  </div>
  {% if images.contact %}<img class="about-img" src="{{ images.contact.image.url }}" alt="{{ images.contact.alt_text }}" loading="lazy">{% endif %}
</section>
{% endblock %}
